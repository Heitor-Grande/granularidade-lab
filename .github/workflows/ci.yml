name: CI - ci-pipeline-lab

on:
  push:
    paths:
      - 'ci-pipeline-lab/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'ci-pipeline-lab/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Lint, test and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ci-pipeline-lab

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: ci-pipeline-lab/package-lock.json

      - name: Setup npm
        run: npm install --global npm@11.6.1

      - name: Show runtime versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Run build
        run: npm run build
